<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <rect width="200" height="200" fill="#fafafa"/>
  <g transform="translate(100,100)">
    <!-- Simplified Ulam spiral: dots at prime positions colored by residue mod 6 -->
    <!-- Class 1 mod 6 (blue) -->
    <circle cx="10" cy="0" r="2.5" fill="#2563eb"/>
    <circle cx="10" cy="-10" r="2.5" fill="#2563eb"/>
    <circle cx="-20" cy="10" r="2.5" fill="#2563eb"/>
    <circle cx="20" cy="-20" r="2.5" fill="#2563eb"/>
    <circle cx="-20" cy="20" r="2.5" fill="#2563eb"/>
    <circle cx="30" cy="10" r="2.5" fill="#2563eb"/>
    <circle cx="-30" cy="-20" r="2.5" fill="#2563eb"/>
    <circle cx="30" cy="-30" r="2.5" fill="#2563eb"/>
    <circle cx="-40" cy="10" r="2.5" fill="#2563eb"/>
    <circle cx="40" cy="-10" r="2.5" fill="#2563eb"/>
    <circle cx="-10" cy="40" r="2.5" fill="#2563eb"/>
    <circle cx="50" cy="20" r="2.5" fill="#2563eb"/>
    <!-- Class 5 mod 6 (red) -->
    <circle cx="0" cy="-10" r="2.5" fill="#dc2626"/>
    <circle cx="-10" cy="10" r="2.5" fill="#dc2626"/>
    <circle cx="20" cy="0" r="2.5" fill="#dc2626"/>
    <circle cx="-10" cy="-20" r="2.5" fill="#dc2626"/>
    <circle cx="20" cy="20" r="2.5" fill="#dc2626"/>
    <circle cx="-30" cy="0" r="2.5" fill="#dc2626"/>
    <circle cx="10" cy="30" r="2.5" fill="#dc2626"/>
    <circle cx="-30" cy="30" r="2.5" fill="#dc2626"/>
    <circle cx="40" cy="0" r="2.5" fill="#dc2626"/>
    <circle cx="-20" cy="-30" r="2.5" fill="#dc2626"/>
    <circle cx="40" cy="30" r="2.5" fill="#dc2626"/>
    <circle cx="-40" cy="-20" r="2.5" fill="#dc2626"/>
    <!-- Primes 2, 3, 5 (green) -->
    <circle cx="0" cy="0" r="3" fill="#16a34a"/>
    <circle cx="-10" cy="0" r="3" fill="#16a34a"/>
    <circle cx="0" cy="10" r="3" fill="#16a34a"/>
  </g>
  <!-- Legend -->
  <circle cx="15" cy="180" r="4" fill="#2563eb"/>
  <text x="24" y="184" font-size="9" fill="#333">1 mod 6</text>
  <circle cx="75" cy="180" r="4" fill="#dc2626"/>
  <text x="84" y="184" font-size="9" fill="#333">5 mod 6</text>
  <circle cx="135" cy="180" r="4" fill="#16a34a"/>
  <text x="144" y="184" font-size="9" fill="#333">2, 3, 5</text>
</svg>
